name: Actualizar indicadores

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    paths:
      - scripts/actualizar_indicadores.py
      - .github/workflows/indicadores.yml

permissions:
  contents: write

concurrency:
  group: indicadores-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Consultar datos públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/actualizar_indicadores.py
      - name: Guardar cambios
        run: |
          git add assets/seguidores.svg assets/estrellas.svg
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Actualizar seguidores y estrellas"
            git push
          fi
